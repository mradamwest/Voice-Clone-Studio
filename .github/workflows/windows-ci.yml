name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Import smoke test
        run: python -c "from voice_clone_studio.app import main; from voice_clone_studio.ui.main_window import MainWindow; print('Voice Clone Studio imports OK')"
      - name: Build packaged application
        run: python -m PyInstaller --noconfirm --clean VoiceCloneStudio.spec
      - name: Verify packaged executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\Voice Clone Studio\Voice Clone Studio.exe")) { throw "Packaged executable missing" }
      - name: Run packaged startup self-test
        shell: powershell
        run: |
          $p = Start-Process ".\dist\Voice Clone Studio\Voice Clone Studio.exe" -ArgumentList "--app-import-self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged startup self-test failed with exit code $($p.ExitCode)" }
      - name: Build Windows installer
        shell: powershell
        run: |
          .\build_windows.ps1
          if (!(Test-Path "dist-installer\Voice_Clone_Studio_Setup_0.1.0.exe")) { throw "Installer missing" }
          $size = (Get-Item "dist-installer\Voice_Clone_Studio_Setup_0.1.0.exe").Length
          if ($size -lt 1000000) { throw "Installer is unexpectedly small" }
      - name: Verify installer contract
        shell: powershell
        run: |
          $iss = Get-Content "installer\VoiceCloneStudio.iss" -Raw
          if ($iss -notmatch "\{autodesktop\}") { throw "Desktop shortcut missing from installer" }
          if ($iss -notmatch "Uninstallable=yes") { throw "Uninstaller is not enabled" }
          if ($iss -notmatch "CreateUninstallRegKey=yes") { throw "Windows uninstall registration missing" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Clone-Studio-Windows
          path: dist-installer/Voice_Clone_Studio_Setup_0.1.0.exe
          if-no-files-found: error
