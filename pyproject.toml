[build-system]
requires = ["setuptools>=75,<76", "wheel>=0.44,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-clone-studio"
version = "0.1.0"
description = "Modern local-first Windows voice cloning studio"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PySide6>=6.8,<6.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pyinstaller>=6.11,<7"]

[project.scripts]
voice-clone-studio = "voice_clone_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]
